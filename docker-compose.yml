#in one line=> start postgreSQL -> run the migration -> start our api
#here are there services -> db-> migration->api

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: olive123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d jobboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DB_HOST: db
      DB_NAME: jobboard
      DB_USER: postgres
      DB_PASSWORD: olive123
    depends_on:
      db:
        condition: service_healthy 
        
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: jobboard
      DB_USER: postgres
      DB_PASSWORD: olive123

    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
volumes:
  postgres_data:  



       
